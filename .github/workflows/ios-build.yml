name: 🍎 Build iOS

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/actions/setup-xcode/**"
      - ".github/workflows/build-ios.yml"
      - "app/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-26

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1

      - name: 🔧 Prebuild native project
        run: npx expo prebuild --platform ios

      - name: List schemes
        working-directory: ios
        run: xcodebuild -list

      - name: 🔨 Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild -workspace *.xcworkspace \
            -scheme LivresdAlgrie \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 📦 Package as unsigned .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ../build.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: app-ios
          path: build.ipa
          retention-days: 90
